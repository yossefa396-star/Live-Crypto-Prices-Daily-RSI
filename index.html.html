<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Live Crypto Prices & Daily RSI</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    
    :root {
      --oversold: #0ecb81; 
      --overbought: #f6465d; 
      --neutral: #94a3b8;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0a0f1c 0%, #1a2338 100%);
      color: #e2e8f0;
      margin: 0;
      padding: 12px;
      min-height: 100vh;
    }
    h1 {
      text-align: center;
      color: #60a5fa;
      font-size: 1.95rem;
      margin-bottom: 6px;
    }
    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 25px;
      font-size: 1rem;
    }
    .container { max-width: 1100px; margin: 0 auto; }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 14px;
    }
    .card {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(96, 165, 250, 0.2);
      border-radius: 18px;
      padding: 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: all 0.3s ease;
    }
    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 15px 30px rgba(96, 165, 250, 0.25);
    }
    .coin-logo {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      object-fit: contain;
      background: #fff;
      padding: 3px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .coin-info { flex: 1; }
    .coin-name { font-size: 1.1rem; font-weight: 600; margin: 0 0 4px 0; }
    .price { font-size: 1.6rem; font-weight: 800; margin: 0; letter-spacing: -0.5px; }
    
    .rsi-container {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }
    .rsi-title {
      font-size: 0.75rem;
      color: #64748b;
      font-weight: bold;
    }
    .rsi-num {
      font-size: 1.2rem;
      font-weight: 700;
    }
    .status-badge {
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 6px;
      text-transform: uppercase;
    }
    .status-neutral { background-color: rgba(148, 163, 184, 0.15); color: var(--neutral); }
    .status-overbought { background-color: rgba(246, 70, 93, 0.15); color: var(--overbought); }
    .status-oversold { background-color: rgba(14, 203, 129, 0.15); color: var(--oversold); }
  </style>
</head>
<body>
  <div class="container">
    <h1>Live Crypto Prices & Daily RSI</h1>
    <p class="subtitle">Real-time Data & 1D RSI Tracker • Powered by Binance</p>
    <div id="cards" class="cards"></div>
  </div>

  <p style="text-align: center; margin-top: 30px; color: #64748b; font-size: 0.95rem;">
    Created by NOUR
  </p>

  <script>
    const coins = {
      "BTCUSDT": { name: "Bitcoin", symbol: "BTC", market: "spot", logo: "https://coin-images.coingecko.com/coins/images/1/thumb/bitcoin.png" },
      "ETHUSDT": { name: "Ethereum", symbol: "ETH", market: "spot", logo: "https://coin-images.coingecko.com/coins/images/279/thumb/ethereum.png" },
      "SOLUSDT": { name: "Solana", symbol: "SOL", market: "spot", logo: "https://coin-images.coingecko.com/coins/images/4128/thumb/solana.png" },
      "LINKUSDT": { name: "Chainlink", symbol: "LINK", market: "spot", logo: "https://coin-images.coingecko.com/coins/images/877/thumb/chainlink-new-logo.png" },
      "KASUSDT": { name: "Kaspa", symbol: "KAS", market: "futures", logo: "https://i.imgur.com/D8XRqF6.png" },
      "TAOUSDT": { name: "Bittensor", symbol: "TAO", market: "spot", logo: "https://cryptologos.cc/logos/bittensor-tao-logo.png" }
    };

    const RSI_PERIOD = 14;
    let btcDominance = null;
    let prices = {};
    let rsiValues = {};
    const priceHistory = {};

    Object.keys(coins).forEach(symbol => {
      priceHistory[symbol] = [];
    });

    // 1. Fetch Initial Data + Latest Price to prevent UI loading lag
    async function fetchHistoryAndPrice(symbol) {
      try {
        const isSpot = coins[symbol].market === 'spot';
        const marketPath = isSpot ? 'api/v3' : 'fapi/v1';
        const baseDomain = isSpot ? 'api.binance.com' : 'fapi.binance.com';
        
        // Fetch 1D candles for RSI
        const response = await fetch(`https://${baseDomain}/${marketPath}/klines?symbol=${symbol}&interval=1d&limit=60`);
        const data = await response.json();
        
        priceHistory[symbol] = data.map(candle => parseFloat(candle[4])); 
        rsiValues[symbol] = calculateRSI(priceHistory[symbol]);

        // Instant price fallback mechanism
        if (priceHistory[symbol].length > 0) {
          prices[symbol] = priceHistory[symbol][priceHistory[symbol].length - 1];
        }
      } catch (error) {
        console.error(`Error fetching historical data for ${symbol}:`, error);
      }
    }

    // 2. RSI Core Formula
    function calculateRSI(pricesList) {
      if (pricesList.length <= RSI_PERIOD) return null;

      let gains = 0;
      let losses = 0;

      for (let i = 1; i <= RSI_PERIOD; i++) {
        const diff = pricesList[i] - pricesList[i - 1];
        if (diff > 0) gains += diff;
        else losses -= diff;
      }

      let avgGain = gains / RSI_PERIOD;
      let avgLoss = losses / RSI_PERIOD;

      for (let i = RSI_PERIOD + 1; i < pricesList.length; i++) {
        const diff = pricesList[i] - pricesList[i - 1];
        avgGain = (avgGain * 13 + (diff > 0 ? diff : 0)) / 14;
        avgLoss = (avgLoss * 13 + (diff < 0 ? -diff : 0)) / 14;
      }

      if (avgLoss === 0) return 100;
      const rs = avgGain / avgLoss;
      return (100 - (100 / (1 + rs))).toFixed(2);
    }

    // 3. Connect Multi-Market WebSockets
    function connectWebSockets() {
      // Spot Streams (BTC, ETH, SOL, LINK, TAO)
      const spotSymbols = Object.keys(coins).filter(s => coins[s].market === 'spot');
      const spotStreams = spotSymbols.map(s => `${s.toLowerCase()}@miniTicker`).join('/');
      const spotWs = new WebSocket(`wss://stream.binance.com:9443/stream?streams=${spotStreams}`);

      spotWs.onmessage = (event) => {
        const data = JSON.parse(event.data);
        const symbol = data.data.s;
        prices[symbol] = parseFloat(data.data.c);
        updateLiveRSI(symbol, prices[symbol], false);
      };

      // Futures Stream (KAS) - Fixed to use completely lowercase stream endpoint
      const futuresWs = new WebSocket(`wss://fstream.binance.com/ws/kasusdt@miniTicker`);
      futuresWs.onmessage = (event) => {
        const data = JSON.parse(event.data);
        // Binance Futures payload has direct keys without data envelope
        const symbol = data.s || "KASUSDT";
        if (data.c) {
          prices[symbol] = parseFloat(data.c);
          updateLiveRSI(symbol, prices[symbol], false);
        }
      };

      // 1D Kline Real-time Candle Closer
      const spotKlineStreams = spotSymbols.map(s => `${s.toLowerCase()}@kline_1d`).join('/');
      const spotKlineWs = new WebSocket(`wss://stream.binance.com:9443/stream?streams=${spotKlineStreams}`);
      spotKlineWs.onmessage = (event) => {
        const data = JSON.parse(event.data);
        updateLiveRSI(data.data.k.s, parseFloat(data.data.k.c), data.data.k.x);
      };

      const futuresKlineWs = new WebSocket(`wss://fstream.binance.com/ws/kasusdt@kline_1d`);
      futuresKlineWs.onmessage = (event) => {
        if(event.data) {
          const data = JSON.parse(event.data);
          if(data.k) updateLiveRSI(data.k.s, parseFloat(data.k.c), data.k.x);
        }
      };

      spotWs.onclose = () => setTimeout(connectWebSockets, 5000);
      futuresWs.onclose = () => setTimeout(connectWebSockets, 5000);
    }

    function updateLiveRSI(symbol, currentPrice, isFinal) {
      if (priceHistory[symbol] && priceHistory[symbol].length > 0) {
        if (isFinal) {
          priceHistory[symbol].push(currentPrice);
          priceHistory[symbol].shift();
        } else {
          priceHistory[symbol][priceHistory[symbol].length - 1] = currentPrice;
        }
        rsiValues[symbol] = calculateRSI(priceHistory[symbol]);
      }
    }

    async function fetchBTCDominance() {
      try {
        const res = await fetch('https://api.coingecko.com/api/v3/global');
        const data = await res.json();
        btcDominance = data.data.market_cap_percentage.btc;
      } catch (e) {
        console.log("BTC Dominance fetch failed");
      }
    }

    function formatPrice(price) {
      if (!price) return "Loading...";
      if (price < 0.0001) return price.toFixed(8);
      if (price < 0.01) return price.toFixed(6);
      if (price < 1) return price.toFixed(4);
      return price.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function getRSIBadge(rsi) {
      if (!rsi) return `<span class="status-badge status-neutral">Loading</span>`;
      if (rsi >= 70) return `<span class="status-badge status-overbought">Overbought</span>`;
      if (rsi <= 30) return `<span class="status-badge status-oversold">Oversold</span>`;
      return `<span class="status-badge status-neutral">Neutral</span>`;
    }

    function getRSIColor(rsi) {
      if (!rsi) return 'var(--neutral)';
      if (rsi >= 70) return 'var(--overbought)';
      if (rsi <= 30) return 'var(--oversold)';
      return '#e2e8f0';
    }

    function renderCards() {
      const container = document.getElementById('cards');
      container.innerHTML = '';

      Object.keys(coins).forEach(symbol => {
        const coin = coins[symbol];
        const price = prices[symbol];
        const rsi = rsiValues[symbol];
        
        container.innerHTML += `
          <div class="card">
            <img src="${coin.logo}" class="coin-logo" alt="${coin.symbol}"
                 onerror="this.src='https://via.placeholder.com/46/1e2937/60a5fa?text=${coin.symbol}'">
            <div class="coin-info">
              <div class="coin-name">${coin.name} <span style="color:#94a3b8;">(${coin.symbol})</span></div>
              <div class="price">$${formatPrice(price)}</div>
            </div>
            <div class="rsi-container">
              <div class="rsi-title">RSI (1D)</div>
              <div class="rsi-num" style="color: ${getRSIColor(rsi)}">${rsi ? rsi : '...'}</div>
              ${getRSIBadge(rsi)}
            </div>
          </div>`;
      });

      container.innerHTML += `
        <div class="card">
          <img src="https://coin-images.coingecko.com/coins/images/1/thumb/bitcoin.png" class="coin-logo" alt="BTCD">
          <div class="coin-info">
            <div class="coin-name">Bitcoin Dominance <span style="color:#94a3b8;">(BTCD)</span></div>
            <div class="price">${btcDominance ? btcDominance.toFixed(2) + '%' : 'Loading...'}</div>
          </div>
        </div>`;
    }

    async function startApp() {
      // Fetch everything concurrently
      await Promise.all(Object.keys(coins).map(symbol => fetchHistoryAndPrice(symbol)));
      await fetchBTCDominance();
      
      renderCards(); // Initial immediate render
      connectWebSockets();
      
      setInterval(renderCards, 1000);
      setInterval(fetchBTCDominance, 30000);
    }

    startApp();
  </script>
</body>
</html>
